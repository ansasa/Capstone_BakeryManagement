
name: BakeryManagement CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    name: Validate, Build and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v6

      
      # 2. Validate standalone HTML files, if present
      - name: Check for HTML files
        id: html-files
        shell: bash
        run: |
          if find . -type f -name '*.html' \
            -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No standalone HTML files found. Razor views require separate validation."
          fi

      - name: Validate HTML
        if: steps.html-files.outputs.found == 'true'
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .


      # 3. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 4. Login to Docker Hub only after merge to main
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build the image; push only on main
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/Bakerymanagement:latest
